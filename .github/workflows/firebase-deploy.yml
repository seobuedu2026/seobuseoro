name: Firebase Hosting 배포

# main 브랜치에 push하면 사이트에 자동 반영된다.
# 필요할 때 Actions 탭에서 수동 실행도 가능하다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    name: seobuseoro.web.app 배포
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Firebase Hosting에 배포
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: seobuseoro
          channelId: live
