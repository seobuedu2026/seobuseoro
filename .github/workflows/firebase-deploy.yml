name: Firebase 배포

# main 브랜치에 push하면 사이트에 자동 반영된다.
# 필요할 때 Actions 탭에서 수동 실행도 가능하다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy-live
  cancel-in-progress: true

jobs:
  deploy:
    name: seobuseoro.web.app 배포
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Hosting 배포
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: seobuseoro
          channelId: live

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 서비스 계정 키 파일 준비
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Firestore 보안 규칙 배포
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --project seobuseoro --non-interactive

      - name: 서비스 계정 키 파일 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
