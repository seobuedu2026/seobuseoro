name: Firebase Hosting 배포

# main 브랜치에 push하면 사이트에 자동 반영된다.
# 필요할 때 Actions 탭에서 수동 실행도 가능하다.
#
# Firestore 보안 규칙(firestore.rules)은 여기서 배포하지 않는다.
# Hosting 배포용 서비스 계정에는 Firestore 관련 권한이 없어 실패하기 때문이다.
# 규칙을 바꾼 경우에는 로컬에서 아래 명령을 한 번 실행한다.
#   firebase deploy --only firestore:rules
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy-live
  cancel-in-progress: true

jobs:
  deploy:
    name: seobuseoro.web.app 배포
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Hosting 배포
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: seobuseoro
          channelId: live
